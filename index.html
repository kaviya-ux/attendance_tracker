
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Attendance Tracker</h1>
        <p class="subtitle">Manage student attendance easily</p>

        <div class="date-box">
            <label for="attendanceDate">Select Date:</label>
            <input type="date" id="attendanceDate">
        </div>

        <div class="add-box">
            <input type="text" id="studentName"
                   placeholder="Enter student name">
            <button onclick="addStudent()">Add Student</button>
        </div>

        <div class="summary">
            <div class="card">
                <h3>Total</h3>
                <p id="total">0</p>
            </div>

            <div class="card present-card">
                <h3>Present</h3>
                <p id="present">0</p>
            </div>

            <div class="card absent-card">
                <h3>Absent</h3>
                <p id="absent">0</p>
            </div>

            <div class="card percentage-card">
                <h3>Attendance</h3>
                <p id="percentage">0%</p>
            </div>
        </div>

        <div class="table-box">
            <table>
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Student Name</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="studentList"></tbody>
            </table>
        </div>

        <p id="message"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
