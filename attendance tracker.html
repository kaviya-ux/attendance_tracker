<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- HEADER -->
    <header class="bg-blue-600 text-white text-center py-6 shadow">
        <h1 class="text-3xl font-bold">
            📋 Attendance Tracker
        </h1>
        <p class="mt-2 text-blue-100">
            Manage student attendance easily
        </p>
    </header>
    <!-- MAIN -->
    <div class="max-w-7xl mx-auto p-6">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- LEFT SIDE -->
            <div>
                <!-- ADD STUDENT -->
                <div class="bg-white rounded-xl shadow p-6">
                    <h2 class="text-xl font-bold mb-5">
                        Add Student
                    </h2>
                    <input type="text" id="studentName" placeholder="Student name"
                        class="w-full border rounded-lg px-4 py-3 mb-4 outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="text" id="studentRoll" placeholder="Roll number"
                        class="w-full border rounded-lg px-4 py-3 mb-4 outline-none focus:ring-2 focus:ring-blue-500">
                    <button
                        onclick="addStudent()"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg">
                        Add Student
                    </button>
                </div>
                <!-- SEARCH -->
                <div class="bg-white rounded-xl shadow p-6 mt-6">
                    <h2 class="text-xl font-bold mb-4">
                        Search Student
                    </h2>
                    <input type="text" id="searchInput" placeholder="Search name or roll number..."
                        oninput="displayStudents()"
                        class="w-full border rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500" >
                </div>
                <!-- SUMMARY -->
                <div class="bg-white rounded-xl shadow p-6 mt-6">
                    <h2 class="text-xl font-bold mb-4">
                        Attendance Summary
                    </h2>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-blue-50 p-4 rounded-lg text-center">
                            <p class="text-sm text-gray-500">
                                Students
                            </p>
                            <p
                                id="totalStudents"
                                class="text-2xl font-bold text-blue-600">
                                0
                            </p>
                        </div>
                        <div class="bg-green-50 p-4 rounded-lg text-center">
                            <p class="text-sm text-gray-500">
                                Present
                            </p>
                            <p id="totalPresent" class="text-2xl font-bold text-green-600">
                                0
                            </p>
                        </div>
                        <div class="bg-red-50 p-4 rounded-lg text-center">
                            <p class="text-sm text-gray-500">
                                Absent
                            </p>
                            <p id="totalAbsent" class="text-2xl font-bold text-red-600">
                                0
                            </p>
                        </div>
                        <div class="bg-purple-50 p-4 rounded-lg text-center">
                            <p class="text-sm text-gray-500">
                                Average
                            </p>
                            <p id="averageAttendance" class="text-2xl font-bold text-purple-600">
                                0%
                            </p>
                        </div>
                    </div>
                </div>
            </div>
            <!-- RIGHT SIDE -->
            <div class="lg:col-span-2">
                <div class="bg-white rounded-xl shadow p-6">
                    <!-- TITLE + CLEAR BUTTON -->
                    <div class="flex justify-between items-center mb-5">
                        <h2 class="text-xl font-bold">
                            Student Attendance
                        </h2>
                        <button onclick="clearAll()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg">
                            Clear All
                        </button>
                    </div>
                    <!-- STUDENTS -->
                    <div id="studentList" class="space-y-4">
                    </div>
                    <!-- EMPTY MESSAGE -->
                    <div id="emptyMessage" class="text-center py-10 text-gray-500">
                        No students added yet.
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        // GET SAVED DATA
        let students =JSON.parse(localStorage.getItem("attendanceStudents")) || [];
        // ADD STUDENT
        function addStudent() {
            const name =document.getElementById("studentName").value.trim();
            const roll =document.getElementById("studentRoll").value.trim();
            if (name === "" || roll === "") {
                alert( "Please enter student name and roll number." );
                return;
            }
            // CHECK DUPLICATE ROLL NUMBER
            const exists =students.some(student =>student.roll.toLowerCase() ===roll.toLowerCase() );
            if (exists) {
                alert( "This roll number already exists.");
                return;
            }
            // CREATE STUDENT
            const student = {
                id: Date.now(),
                name: name,
                roll: roll,
                present: 0,
                absent: 0,
                total: 0
            };
            students.push(student);
            saveStudents();
            // CLEAR INPUTS
            document.getElementById("studentName").value = "";
            document.getElementById("studentRoll").value = "";
            displayStudents();
        }
        // DISPLAY STUDENTS
        function displayStudents() {
            const list =document.getElementById("studentList");
            const empty =document.getElementById("emptyMessage");
            const search =document.getElementById("searchInput").value.toLowerCase().trim();
            const filtered =students.filter(student =>
                    student.name.toLowerCase().includes(search)
                    ||
                    student.roll.toLowerCase().includes(search));
            list.innerHTML = "";
            if (filtered.length === 0) {
                empty.style.display = "block";
            } else {
                empty.style.display = "none";
            }
            filtered.forEach(student => {
                const percentage =student.total > 0
                    ? Math.round((student.present /student.total) * 100): 0;
                const card =document.createElement("div");
                card.className =
                    "border rounded-xl p-5";
                card.innerHTML = `
                    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                        <div>
                            <h3 class="text-lg font-bold text-gray-800">
                                ${student.name}
                            </h3>
                            <p class="text-gray-500">
                                Roll No: ${student.roll}
                            </p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="markPresent(${student.id})"
                                class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg">
                                Present
                            </button>
                            <button onclick="markAbsent(${student.id})"
                                class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg">
                                Absent
                            </button>
                            <button onclick="deleteStudent(${student.id})"
                                class="bg-gray-700 hover:bg-gray-800 text-white px-4 py-2 rounded-lg">
                                Delete
                            </button>
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-3 mt-5">
                        <div class="bg-green-50 p-3 rounded-lg text-center">
                            <p class="text-sm text-gray-500">
                                Present
                            </p>
                            <p class="text-xl font-bold text-green-600">
                                ${student.present}
                            </p>
                        </div>
                        <div class="bg-red-50 p-3 rounded-lg text-center">
                            <p class="text-sm text-gray-500">
                                Absent
                            </p>
                            <p class="text-xl font-bold text-red-600">
                                ${student.absent}
                            </p>
                        </div>
                        <div class="bg-blue-50 p-3 rounded-lg text-center">
                            <p class="text-sm text-gray-500">
                                Attendance
                            </p>
                            <p class="text-xl font-bold text-blue-600">
                                ${percentage}%
                            </p>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
            updateSummary();
        }
        function markPresent(id) {
            const student =
                students.find( student => student.id === id);
            if (!student) return;
            student.present++;
            student.total++;
            saveStudents();
            displayStudents();
        }
        function markAbsent(id) {
            const student =
                students.find( student => student.id === id );
            if (!student) return;
            student.absent++;
            student.total++;
            saveStudents();
            displayStudents();
        }
        function deleteStudent(id) {
            const confirmDelete =
                confirm( "Delete this student?" );
            if (!confirmDelete) return;
            students =
                students.filter( student => student.id !== id );
            saveStudents();
            displayStudents();
        }
        function clearAll() {
            if (students.length === 0) {
                alert("There are no records to clear.");
                return;
            }
            const confirmClear =
                confirm(
                    "Are you sure? This will permanently clear all student records and attendance."
                );
            if (!confirmClear) return;
            students = [];
            localStorage.removeItem( "attendanceStudents" );
            document.getElementById( "searchInput" ).value = "";
            document.getElementById( "studentName" ).value = "";
            document.getElementById( "studentRoll" ).value = "";
            displayStudents();
        }
        function updateSummary() {
            let totalPresent = 0;
            let totalAbsent = 0;
            let totalPercentage = 0;
            let countedStudents = 0;
            students.forEach(student => {
                totalPresent += student.present;
                totalAbsent += student.absent;
                if (student.total > 0) {
				totalPercentage += (student.present / student.total) * 100;
                    countedStudents++;
                }
            });
            const average = countedStudents > 0 ? Math.round( totalPercentage / countedStudents ): 0;
            document.getElementById("totalStudents").textContent = students.length;
            document.getElementById("totalPresent").textContent = totalPresent;
            document.getElementById("totalAbsent").textContent = totalAbsent;
            document.getElementById( "averageAttendance").textContent = average + "%";
        }
        function saveStudents() {
            localStorage.setItem( "attendanceStudents",JSON.stringify(students)
            );
        }
        displayStudents();
    </script>
</body>
</html>
